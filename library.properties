sentence=Header-only timegrapher for mechanical watches and clocks with a Material Design touch GUI.
paragraph=Listens to the ticks of a mechanical movement through a microphone and measures rate (s/day), beat error, amplitude, beat rate, tick/tock ratio, jitter and SNR. Shows the standard timegrapher chart, a volume chart and KPI trends. Arduino port of Android-TimeGrapher using arduino-audio-tools and TinyMaterialDesign.
